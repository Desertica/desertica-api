name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: desertica
          POSTGRES_PASSWORD: desertica
          POSTGRES_DB: desertica
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U desertica -d desertica"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://desertica:desertica@localhost:5432/desertica?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npx prisma migrate deploy
      - run: npm run test:e2e
      - run: npm run build
