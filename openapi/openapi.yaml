      responses:
        '200':
          description: Clientes
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Customer' }
                  meta: { $ref: '#/components/schemas/Meta' }
  /customers/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      operationId: getCustomer
      tags: [Customers]
      summary: Ver un cliente con su historial de reservas
      x-permission: customers:read
      responses:
        '404': { $ref: '#/components/responses/Error' }
        '200':
          description: Cliente
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Customer' }
    patch:
      operationId: updateCustomer
      tags: [Customers]
      summary: Editar un cliente
      x-permission: customers:write
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CustomerInput' }
      responses:
        '404': { $ref: '#/components/responses/Error' }
        '200':
          description: Cliente
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Customer' }
  /customers/{id}/erase:
    post:
      operationId: eraseCustomer
      tags: [Customers]
      summary: Atender un pedido de eliminación de datos (ARCO)
      description: Anonimiza lo que no deba conservarse por obligación legal (comprobantes).
      x-permission: customers:erase
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '204': { description: Procesado }

  # -------------------------------------------------------------- Compliance
  /complaints:
    get:
      operationId: listComplaints
      tags: [Compliance]
      summary: Listar reclamos y quejas
      x-permission: complaints:read
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/ComplaintStatus' }
      responses:
        '200':
          description: Reclamos
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Complaint' }
                  meta: { $ref: '#/components/schemas/Meta' }
  /complaints/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer }
    get:
      operationId: getComplaint
      tags: [Compliance]
      summary: Ver un reclamo
      x-permission: complaints:read
      responses:
        '404': { $ref: '#/components/responses/Error' }
        '200':
          description: Reclamo
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Complaint' }
  /complaints/{id}/answer:
    post:
      operationId: answerComplaint
      tags: [Compliance]
      summary: Responder un reclamo
      description: Guarda la respuesta y la envía por correo al consumidor.
      x-permission: complaints:write
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [answer]
              properties:
                answer: { type: string }
      responses:
        '409': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '200':
          description: Reclamo respondido
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Complaint' }
  /waivers:
    get:
      operationId: listWaivers
      tags: [Compliance]
      summary: Listar descargos de responsabilidad
      x-permission: waivers:read
      parameters:
        - name: bookingId
          in: query
          schema: { type: string, format: uuid }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/WaiverStatus' }
      responses:
        '200':
          description: Descargos
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Waiver' }
  /legal-documents:
    post:
      operationId: publishLegalDocument
      tags: [Compliance]
      summary: Publicar una nueva versión de un documento legal
      description: |
        Trae la página `cmsSlug` del CMS en el idioma `locale` y guarda un snapshot inmutable de su texto
        (un trigger de la base impide modificarlo o borrarlo). La versión es la siguiente de `(kind, locale)`.
        Responde 422 si el CMS no tiene esa página y 503 si el CMS no responde.
      x-permission: legal:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, locale, cmsSlug]
              properties:
                kind: { $ref: '#/components/schemas/LegalDocumentKind' }
                locale: { type: string }
                cmsSlug: { type: string }
      responses:
        '201':
          description: Versión publicada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LegalDocument' }

