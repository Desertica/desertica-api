                    items: { $ref: '#/components/schemas/PriceRule' }
                  meta: { $ref: '#/components/schemas/Meta' }
    post:
      operationId: createPriceRule
      tags: [Catalog]
      summary: Crear una regla de precio
      x-permission: prices:write
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PriceRuleInput' }
      responses:
        '201':
          description: Regla
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PriceRule' }
  /price-rules/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    put:
      operationId: replacePriceRule
      tags: [Catalog]
      summary: Reemplazar una regla de precio
      x-permission: prices:write
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PriceRuleInput' }
      responses:
        '404': { $ref: '#/components/responses/Error' }
        '200':
          description: Regla
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PriceRule' }
    delete:
      operationId: deactivatePriceRule
      tags: [Catalog]
      summary: Desactivar una regla de precio
      x-permission: prices:write
      responses:
        '404': { $ref: '#/components/responses/Error' }
        '204': { description: Desactivada }
  /blackouts:
    get:
      operationId: listBlackouts
      tags: [Catalog]
      summary: Listar fechas bloqueadas
      x-permission: departures:read
      responses:
        '200':
          description: Bloqueos
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Blackout' }
    post:
      operationId: createBlackout
      tags: [Catalog]
      summary: Crear una fecha bloqueada
      x-permission: departures:write
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BlackoutInput' }
      responses:
        '201':
          description: Bloqueo
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Blackout' }
  /blackouts/{id}:
    delete:
      operationId: deleteBlackout
      tags: [Catalog]
      summary: Eliminar una fecha bloqueada
      x-permission: departures:write
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '404': { $ref: '#/components/responses/Error' }
        '204': { description: Eliminada }
  /cancellation-policies:
    get:
      operationId: listCancellationPolicies
      tags: [Catalog]
      summary: Listar políticas de cancelación
      x-permission: catalog:read
      responses:
        '200':
          description: Políticas
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/CancellationPolicy' }
    post:
      operationId: createCancellationPolicy
      tags: [Catalog]
      summary: Crear una versión de política de cancelación
      x-permission: catalog:write
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CancellationPolicyInput' }
      responses:
        '201':
          description: Política
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CancellationPolicy' }

  # ---------------------------------------------------------------- Bookings
  /bookings:
    get:
      operationId: listBookings
      tags: [Bookings]
      summary: Listar reservas
      x-permission: bookings:read
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/BookingStatus' }
        - name: departureId
          in: query
          schema: { type: string, format: uuid }
        - name: tourRefId
          in: query
          schema: { type: string, format: uuid }
        - name: from
          in: query
          schema: { type: string, format: date-time }
        - name: to
          in: query
          schema: { type: string, format: date-time }
        - name: q
          in: query
          description: Busca por referencia, nombre, correo o documento.
          schema: { type: string }
        - name: source
          in: query
          schema: { type: string, enum: [WEB, MANUAL] }
        - name: currency
          in: query
          schema: { $ref: '#/components/schemas/Currency' }
        - name: customerId
          in: query
          schema: { type: string, format: uuid }
        - name: paymentStatus
          in: query
          description: UNPAID = sin pagos; PARTIAL = pagó algo pero queda saldo; PAID = sin saldo.
          schema: { type: string, enum: [UNPAID, PARTIAL, PAID] }
        - name: waiverStatus
          in: query
          description: PENDING = al menos un descargo sin firmar.
          schema: { $ref: '#/components/schemas/WaiverStatus' }
      responses:
        '200':
          description: Reservas
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/BookingSummary' }
                  meta: { $ref: '#/components/schemas/Meta' }
    post:
      operationId: createManualBooking
      tags: [Bookings]
      summary: Crear una reserva manual (asistida)
      description: Para ventas por WhatsApp o en persona. Descuenta cupo sin pasar por el bloqueo temporal.
      x-permission: bookings:write
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateManualBooking' }
      responses:
        '404': { $ref: '#/components/responses/Error' }
        '201':
          description: Reserva
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Booking' }
        '409': { $ref: '#/components/responses/Error' }
  /bookings/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      operationId: getBooking
      tags: [Bookings]
      summary: Ver una reserva con pagos, comprobantes y descargos
      x-permission: bookings:read
      responses:
        '200':
          description: Reserva
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Booking' }
        '404': { $ref: '#/components/responses/Error' }
    patch:
      operationId: updateBooking
      tags: [Bookings]
      summary: Editar notas, datos de contacto o pasajeros
      x-permission: bookings:write
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateBooking' }
      responses:
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '200':
          description: Reserva
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Booking' }
  /bookings/quote:
    post:
      operationId: createStaffQuote
      tags: [Bookings]
      summary: Cotizar una reserva manual
      description: Igual que la cotización pública, pero admite un precio acordado (`overrideTotalCents`, requiere `bookings:override`).
      x-permission: bookings:write
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StaffQuoteRequest' }
      responses:
        '200':
          description: Cotización
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Quote' }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /bookings/{id}/cancellation-quote:
    get:
      operationId: getCancellationQuote
      tags: [Bookings]
      summary: Ver cuánto se reembolsaría antes de cancelar
      description: Calcula el reembolso con la política vigente al reservar, sin cambiar nada.
      x-permission: bookings:read
      parameters:
        - $ref: '#/components/parameters/Id'
        - name: refund
          in: query
          schema: { type: string, enum: [POLICY, FULL, NONE], default: POLICY }
      responses:
        '200':
          description: Cálculo
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CancellationQuote' }
        '404': { $ref: '#/components/responses/Error' }
  /bookings/{id}/cancel:
    post:
      operationId: cancelBooking
      tags: [Bookings]
      summary: Cancelar una reserva
      description: |
        Calcula el reembolso con la política de cancelación vigente al reservar. Con `refund = POLICY`
        devuelve lo que corresponde; con `FULL` o `NONE` fuerza el monto (requiere `bookings:override`).
      x-permission: bookings:cancel
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason, refund]
              properties:
                reason: { type: string }
                refund: { type: string, enum: [POLICY, FULL, NONE] }
      responses:
        '404': { $ref: '#/components/responses/Error' }
        '200':
          description: Reserva cancelada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Booking' }
        '409': { $ref: '#/components/responses/Error' }
  /bookings/{id}/reschedule:
    post:
      operationId: rescheduleBooking
      tags: [Bookings]
      summary: Mover una reserva a otra salida
      description: Si cambia el precio, devuelve `adjustment` con el cobro adicional o el reembolso parcial.
      x-permission: bookings:write
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [targetDepartureId]
              properties:
                targetDepartureId: { type: string, format: uuid }
                reason: { type: string }
      responses:
        '404': { $ref: '#/components/responses/Error' }
        '200':
          description: Reserva movida
          content:
            application/json:
              schema:
                type: object
                required: [booking]
                properties:
                  booking: { $ref: '#/components/schemas/Booking' }
                  adjustment:
                    type: object
                    properties:
                      type: { type: string, enum: [CHARGE, REFUND] }
                      amountCents: { type: integer }
        '409': { $ref: '#/components/responses/Error' }
  /bookings/{id}/status:
    post:
      operationId: setBookingStatus
      tags: [Bookings]
      summary: Marcar una reserva como completada o no-show
      x-permission: bookings:write
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [COMPLETED, NO_SHOW] }
      responses:
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '200':
          description: Reserva
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Booking' }
  /bookings/{id}/payment-links:
    post:
      operationId: createPaymentLink
      tags: [Payments]
      summary: Generar un enlace de pago
      description: Para cobrar el total, el depósito o el saldo de una reserva (también enviado por email/WhatsApp).
      x-permission: payments:write
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind]
              properties:
                kind: { $ref: '#/components/schemas/PaymentKind' }
                amountCents:
                  type: integer
                  description: Opcional; por defecto el monto pendiente de ese tipo.
                expiresInHours: { type: integer, minimum: 1, maximum: 720, default: 48 }
      responses:
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '201':
          description: Enlace
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentLink' }
  /bookings/{id}/payments/manual:
    post:
      operationId: recordManualPayment
      tags: [Payments]
      summary: Registrar un pago manual
      description: Efectivo, transferencia o Yape personal. No pasa por pasarela.
      x-permission: payments:write
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [method, kind, amountCents, currency]
              properties:
                method:
                  type: string
                  enum: [CASH, TRANSFER, YAPE, OTHER]
                kind: { $ref: '#/components/schemas/PaymentKind' }
                amountCents: { type: integer, minimum: 1 }
                currency: { $ref: '#/components/schemas/Currency' }
                reference: { type: string, description: Número de operación o nota. }
                paidAt: { type: string, format: date-time }
      responses:
        '404': { $ref: '#/components/responses/Error' }
        '201':
          description: Pago
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Payment' }
        '409': { $ref: '#/components/responses/Error' }
  /bookings/{id}/documents:
    post:
      operationId: issueDocument
      tags: [Documents]
      summary: Emitir el comprobante de una reserva
      description: |
        Asigna serie y correlativo, calcula base e IGV y deja el envío a `desertica-billing` en una cola con
        reintentos (la misma `externalId` en cada uno). Responde 202 con el comprobante en `PENDING`: su estado
        final llega después. 409 si no hay empresa o serie configuradas, si el pago ya tiene comprobante o si no
        queda nada por documentar.
      x-permission: documents:issue
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                paymentId:
                  type: string
                  format: uuid
                  description: Pago al que corresponde; por defecto el total cobrado.
                docType:
                  type: string
                  enum: [BOLETA, FACTURA]
                  description: Por defecto el elegido por el cliente al reservar.
      responses:
        '202':
          description: Emisión encolada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Document' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  # ---------------------------------------------------------------- Payments
  /payments:
    get:
      operationId: listPayments
      tags: [Payments]
      summary: Listar pagos
      x-permission: payments:read
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/PaymentStatus' }
        - name: provider
          in: query
          schema: { $ref: '#/components/schemas/PaymentProvider' }
        - name: from
          in: query
          schema: { type: string, format: date-time }
        - name: to
          in: query
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: Pagos
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Payment' }
                  meta: { $ref: '#/components/schemas/Meta' }
  /payments/{id}:
    get:
      operationId: getPayment
      tags: [Payments]
      summary: Ver un pago
      x-permission: payments:read
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Pago
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Payment' }
        '404': { $ref: '#/components/responses/Error' }
  /payments/{id}/refunds:
    post:
      operationId: createRefund
      tags: [Payments]
      summary: Reembolsar un pago
      description: |
        Ejecuta la devolución en la pasarela (o la registra si el pago fue manual), actualiza la reserva y
        emite la nota de crédito si había comprobante. Si lo ya devuelto de la reserva (más lo pendiente) más este
        monto supera `operatorRefundLimitCents`, hace falta `payments:refund-any` (403 si no se tiene).
      x-permission: payments:refund
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amountCents, reason]
              properties:
                amountCents: { type: integer, minimum: 1 }
                reason: { type: string }
      responses:
        '201':
          description: Reembolso
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Refund' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /refunds/{id}/complete:
    post:
      operationId: completeRefund
      tags: [Payments]
      summary: Confirmar un reembolso manual pendiente
      description: |
        Para pagos manuales (efectivo, transferencia, Yape) la cancelación deja el reembolso en `PENDING`: el
        staff devuelve el dinero por su cuenta y lo confirma aquí. Actualiza `refundedCents` del pago y de la
        reserva. Los reembolsos de pasarela los ejecuta el API solo y no se confirman a mano.
      x-permission: payments:refund
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Reembolso confirmado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Refund' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /refunds:
    get:
      operationId: listRefunds
      tags: [Payments]
      summary: Listar reembolsos
      x-permission: payments:read
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Reembolsos
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Refund' }
                  meta: { $ref: '#/components/schemas/Meta' }
  /disputes:
    get:
      operationId: listDisputes
      tags: [Payments]
      summary: Listar disputas y contracargos
      x-permission: payments:read
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/DisputeStatus' }
      responses:
        '200':
          description: Disputas
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Dispute' }
                  meta: { $ref: '#/components/schemas/Meta' }
  /disputes/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      operationId: getDispute
      tags: [Payments]
      summary: Ver una disputa
      x-permission: payments:read
      responses:
        '200':
          description: Disputa
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Dispute' }
        '404': { $ref: '#/components/responses/Error' }
    patch:
      operationId: updateDispute
      tags: [Payments]
      summary: Actualizar estado o notas de una disputa
      x-permission: payments:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status: { $ref: '#/components/schemas/DisputeStatus' }
                notes: { type: string }
      responses:
        '200':
          description: Disputa
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Dispute' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /disputes/{id}/evidence:
    get:
      operationId: downloadDisputeEvidence
      tags: [Payments]
      summary: Descargar el paquete de evidencia de una disputa
      description: ZIP con confirmación, políticas aceptadas, descargo firmado, manifiesto y comprobante.
      x-permission: payments:read
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Paquete
          content:
            application/zip:
              schema: { type: string, format: binary }
        '404': { $ref: '#/components/responses/Error' }

  # --------------------------------------------------------------- Documents
  /documents:
    get:
      operationId: listDocuments
      tags: [Documents]
      summary: Listar comprobantes
      x-permission: documents:read
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: status
          in: query
