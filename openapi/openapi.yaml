openapi: 3.1.0
info:
  title: Desertica API
  version: 0.1.0
  summary: Contrato del backend transaccional de Desertica.
  description: |
    Fuente de verdad del contrato entre `desertica-api`, `desertica-web` y `desertica-backoffice`.
    Un cambio de contrato se hace primero en este archivo, por PR, y después se implementa.

    ## Convenciones
    - **Dinero**: enteros en la unidad menor (`*Cents`), con IGV incluido. El precio es único para todos
      los clientes. Monedas: `USD` y `PEN`.
    - **Fechas**: ISO 8601 en UTC. Las reglas de negocio (cortes de venta, recordatorios) usan `America/Lima`.
    - **Paginación**: `page` (desde 1) y `pageSize` (máximo 100). Las listas responden `{ data, meta }`.
    - **Errores**: `{ statusCode, error, message, details? }`. Los errores transversales no se repiten en cada
      operación: `400` (JSON mal formado), `401`, `403` (con `details.required` = permisos que faltan),
      `422` (validación de la entrada, incluidos ids mal formados; `message` lista cada campo), `429` y `5xx`.
    - **Idempotencia**: los `POST` que crean reservas y pagos aceptan `Idempotency-Key`; repetir la clave
      devuelve la respuesta original. Reusar la clave con otro cuerpo responde `422`. Una petición simultánea
      con la misma clave espera a la primera. En `createPublicBooking` la repetición devuelve la misma reserva
      con un `accessToken` nuevo (el original no se guarda en claro).
    - **Autenticación**: el staff usa `Authorization: Bearer <jwt>` (login con Google). El cliente accede a su
      reserva con `X-Booking-Token`. Los webhooks se validan por firma del proveedor.
    - **Permisos**: cada operación del staff declara `x-permission`. El rol `admin` tiene todos; `operator`
      tiene los de reservas, calendario, clientes, pagos (reembolsos hasta un tope), comprobantes y reclamos,
      y no tiene `users:*`, `company:*`, `settings:*` ni `documents:void`.
    - **Contenido editorial** (títulos, textos, medios) no pasa por este API: lo sirve el CMS.

    ## Sesión del staff
    `POST /auth/google` devuelve el token de acceso en el cuerpo y fija el refresh token en la cookie
    `desertica_refresh` (`HttpOnly; Secure; SameSite=Strict; Path=/api/auth`). El backoffice y el API deben
    estar en el mismo sitio (subdominios del mismo dominio) y el API acepta CORS con credenciales solo desde
    los orígenes configurados. El refresh rota en cada uso y reutilizar uno viejo revoca todas las sesiones.

    ## Enlaces de los correos
    Se arman sobre `PUBLIC_WEB_URL`: acceso a la reserva `/booking/{reference}?token=<accessToken>`,
    descargo `/waiver/{token}` y enlace de pago `/pay/{token}`. El sitio web debe implementar esas rutas.

    ## IP del cliente
    El sitio web llama a `/public/*` a través de su servidor y reenvía la IP real en `X-Forwarded-For`. El API
    solo la confía hasta el número de saltos de `TRUST_PROXY` (2 detrás de Cloudflare y Coolify); sin eso todos
    los visitantes compartirían un único contador de límite de peticiones.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: /api
tags:
  - name: Public
    description: Endpoints del sitio web (sin cuenta).
  - name: Webhooks
    description: Eventos entrantes de las pasarelas de pago.
  - name: Auth
    description: Sesión del staff.
  - name: Catalog
    description: Tours, precios, salidas y políticas.
  - name: Bookings
    description: Reservas y su ciclo de vida.
  - name: Payments
    description: Pagos, enlaces de pago, reembolsos y disputas.
  - name: Documents
    description: Comprobantes electrónicos.
  - name: Customers
    description: Clientes.
  - name: Compliance
    description: Reclamaciones, descargos y documentos legales.
  - name: Admin
    description: Usuarios, empresa, series, ajustes y auditoría.
  - name: Reports
    description: Reportes y panel.
  - name: Health
    description: Estado del servicio.
security:
  - bearerAuth: []
paths:
  /health:
    get:
      operationId: getHealth
      tags: [Health]
      summary: Liveness
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [status, service]
                properties:
                  status: { type: string, enum: [ok] }
                  service: { type: string }
  /health/ready:
    get:
      operationId: getHealthReady
      tags: [Health]
      summary: Readiness (base de datos y Redis)
      security: []
      responses:
        '200': { description: Listo }
        '503': { $ref: '#/components/responses/Error' }

  # ------------------------------------------------------------------ Public
  /public/tours/{slug}/availability:
    get:
      operationId: getTourAvailability
      tags: [Public]
      summary: Disponibilidad y precios de un tour para un mes
      security: []
      parameters:
        - $ref: '#/components/parameters/TourSlug'
        - name: month
          in: query
          required: true
          schema: { type: string, pattern: '^\d{4}-(0[1-9]|1[0-2])$' }
        - name: currency
          in: query
          required: true
          schema: { $ref: '#/components/schemas/Currency' }
        - name: format
          in: query
          schema: { $ref: '#/components/schemas/TourFormat' }
        - name: language
          in: query
          schema: { type: string, example: es }
      responses:
        '200':
          description: Salidas del mes con cupo y precio
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/AvailableDeparture' }
        '404': { $ref: '#/components/responses/Error' }
  /public/quotes:
    post:
      operationId: createQuote
      tags: [Public]
      summary: Cotizar una reserva
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/QuoteRequest' }
      responses:
        '200':
          description: Cotización
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Quote' }
        '422': { $ref: '#/components/responses/Error' }
  /public/holds:
    post:
      operationId: createHold
      tags: [Public]
      summary: Bloquear cupo temporalmente
      description: Reserva los asientos durante unos minutos mientras el cliente completa el pago.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [departureId, seats]
              properties:
                departureId: { type: string, format: uuid }
                seats: { type: integer, minimum: 1, maximum: 20 }
                turnstileToken: { type: string }
      responses:
        '404': { $ref: '#/components/responses/Error' }
        '201':
          description: Cupo bloqueado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Hold' }
        '409':
          description: Sin cupo suficiente
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /public/holds/{token}:
    delete:
      operationId: releaseHold
      tags: [Public]
      summary: Liberar un bloqueo de cupo
      security: []
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string }
      responses:
        '204': { description: Liberado }
  /public/bookings:
    post:
      operationId: createPublicBooking
      tags: [Public]
      summary: Crear una reserva desde un bloqueo de cupo
      security: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreatePublicBooking' }
      responses:
        '201':
          description: Reserva creada pendiente de pago
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicBookingCreated' }
        '409': { $ref: '#/components/responses/Error' }
        '410':
          description: El bloqueo de cupo expiró
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /public/bookings/access:
    post:
      operationId: requestBookingAccess
      tags: [Public]
      summary: Pedir acceso a "mi reserva"
      description: Envía por email un enlace con el token de acceso. Responde igual exista o no la reserva.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reference, email]
              properties:
                reference: { type: string }
                email: { type: string, format: email }
      responses:
        '202': { description: Aceptado }
        '429': { $ref: '#/components/responses/Error' }
  /public/bookings/{reference}:
    get:
      operationId: getPublicBooking
      tags: [Public]
      summary: Ver una reserva con el token del cliente
      security:
        - bookingToken: []
      parameters:
        - $ref: '#/components/parameters/Reference'
      responses:
        '200':
          description: Reserva
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicBooking' }
        '401': { $ref: '#/components/responses/Error' }
  /public/bookings/{reference}/payments/stripe-intent:
    post:
      operationId: createBookingStripeIntent
      tags: [Public]
      summary: Crear un PaymentIntent de Stripe (USD)
      security:
        - bookingToken: []
      parameters:
        - $ref: '#/components/parameters/Reference'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreatePaymentRequest' }
      responses:
        '201':
          description: Intent creado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StripeIntent' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '502': { $ref: '#/components/responses/Error' }
  /public/bookings/{reference}/payments/culqi-charge:
    post:
      operationId: createBookingCulqiCharge
      tags: [Public]
      summary: Cobrar con un token de Culqi (USD o PEN)
      security:
        - bookingToken: []
      parameters:
        - $ref: '#/components/parameters/Reference'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CulqiChargeRequest' }
      responses:
        '201':
          description: Resultado del cobro
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CulqiChargeResult' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '502': { $ref: '#/components/responses/Error' }
  /public/payment-links/{token}:
    get:
      operationId: getPaymentLinkInfo
      tags: [Public]
      summary: Ver un enlace de pago
      security: []
      parameters:
        - $ref: '#/components/parameters/LinkToken'
      responses:
        '200':
          description: Datos del enlace
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentLinkInfo' }
        '404': { $ref: '#/components/responses/Error' }
        '410': { $ref: '#/components/responses/Error' }
  /public/payment-links/{token}/stripe-intent:
    post:
      operationId: createLinkStripeIntent
      tags: [Public]
      summary: Crear un PaymentIntent para un enlace de pago
      security: []
      parameters:
        - $ref: '#/components/parameters/LinkToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: Intent creado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StripeIntent' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '410': { $ref: '#/components/responses/Error' }
        '502': { $ref: '#/components/responses/Error' }
  /public/payment-links/{token}/culqi-charge:
    post:
      operationId: createLinkCulqiCharge
      tags: [Public]
      summary: Cobrar con Culqi desde un enlace de pago
      security: []
      parameters:
        - $ref: '#/components/parameters/LinkToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, email]
              properties:
                token: { type: string, description: Token generado por Culqi.js }
                email: { type: string, format: email }
                paymentId: { type: string, format: uuid, description: Pago `REQUIRES_ACTION` que se continúa tras 3DS. }
                authentication3DS: { type: object, additionalProperties: true }
      responses:
        '201':
          description: Resultado del cobro
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CulqiChargeResult' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '410': { $ref: '#/components/responses/Error' }
        '502': { $ref: '#/components/responses/Error' }
  /public/documents/{id}/pdf:
    get:
      operationId: downloadPublicDocumentPdf
      tags: [Public]
      summary: Descargar el PDF de un comprobante con un enlace firmado
      description: |
        El enlace (`pdfUrl` de `PublicBooking.documents`) lleva `exp` y `sig` (HMAC) y vale una hora; cada lectura
        de la reserva genera uno nuevo. Un enlace inválido o vencido, o un comprobante que no es boleta ni factura
        vigente, responde 404.
      security: []
      parameters:
        - $ref: '#/components/parameters/Id'
        - name: exp
          in: query
          required: true
          schema: { type: integer, description: Vencimiento en segundos Unix. }
        - name: sig
          in: query
          required: true
          schema: { type: string }
      responses:
        '200':
          description: PDF
          content:
            application/pdf:
              schema: { type: string, format: binary }
        '404': { $ref: '#/components/responses/Error' }
  /public/waivers/{token}:
    get:
      operationId: getWaiverForm
      tags: [Public]
      summary: Ver el descargo de responsabilidad a firmar
      security: []
      parameters:
        - $ref: '#/components/parameters/LinkToken'
      responses:
        '200':
          description: Descargo
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WaiverForm' }
        '404': { $ref: '#/components/responses/Error' }
  /public/waivers/{token}/sign:
    post:
      operationId: signWaiver
      tags: [Public]
      summary: Firmar el descargo de responsabilidad
      security: []
      parameters:
        - $ref: '#/components/parameters/LinkToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [signerName, signerDocType, signerDocNumber, accepted]
              properties:
                signerName: { type: string }
                signerDocType: { $ref: '#/components/schemas/IdDocType' }
                signerDocNumber: { type: string }
                onBehalfOfMinor: { type: boolean }
                medicalNotes: { type: string, maxLength: 1000 }
                emergencyContactName: { type: string }
                emergencyContactPhone: { type: string }
                accepted: { type: boolean, const: true }
      responses:
        '200':
          description: Firmado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WaiverForm' }
        '409': { $ref: '#/components/responses/Error' }
  /public/complaints:
    post:
      operationId: createComplaint
      tags: [Public]
      summary: Registrar un reclamo o queja (Libro de Reclamaciones)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateComplaint' }
      responses:
        '201':
          description: Registrado; se envía copia al correo del reclamante
          content:
            application/json:
              schema:
                type: object
                required: [correlative, dueAt]
                properties:
                  correlative: { type: integer }
                  dueAt: { type: string, format: date-time }
        '429': { $ref: '#/components/responses/Error' }
  /public/contact-messages:
    post:
      operationId: createContactMessage
      tags: [Public]
      summary: Enviar un mensaje de contacto
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, message]
              properties:
                name: { type: string }
                email: { type: string, format: email }
                whatsapp: { type: string }
                country: { type: string }
                message: { type: string }
                locale: { type: string }
                turnstileToken: { type: string }
      responses:
        '202': { description: Aceptado }
        '429': { $ref: '#/components/responses/Error' }
  /public/consents:
    post:
      operationId: recordConsent
      tags: [Public]
      summary: Registrar el consentimiento de cookies
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [anonymousId, categories, policyVersion]
              properties:
                anonymousId: { type: string }
                categories:
                  type: object
                  additionalProperties: { type: boolean }
                policyVersion: { type: integer }
      responses:
        '204': { description: Registrado }
  /public/legal-documents/current:
    get:
      operationId: getCurrentLegalDocuments
      tags: [Public]
      summary: Versiones vigentes de los documentos legales
      security: []
      parameters:
        - name: locale
          in: query
          required: true
          schema: { type: string, example: es }
      responses:
        '200':
          description: Versiones vigentes
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/LegalDocument' }

  # ---------------------------------------------------------------- Webhooks
  /webhooks/stripe:
    post:
      operationId: receiveStripeWebhook
      tags: [Webhooks]
      summary: Eventos de Stripe
      description: |
        Valida `Stripe-Signature` sobre el cuerpo crudo (400 si falta o no coincide), guarda el evento en
        `WebhookEvent` (idempotente por `eventId`) y responde 200 aunque ya estuviera procesado. Eventos usados:
        `payment_intent.succeeded|payment_failed|canceled|requires_action`, `refund.created|updated|failed` y
        `charge.dispute.created|updated|closed|funds_withdrawn|funds_reinstated`. 503 si el webhook no está configurado.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        '200': { description: Recibido }
        '400': { $ref: '#/components/responses/Error' }
        '409':
          description: Evento fuera de orden (un reembolso o una disputa llegó antes de que el cobro se acreditara). No se guarda como procesado; la pasarela lo reenvía y entonces se aplica.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /webhooks/culqi:
    post:
      operationId: receiveCulqiWebhook
      tags: [Webhooks]
      summary: Eventos de Culqi
      description: |
        Valida la firma HMAC-SHA256 del cuerpo en `x-culqi-signature` (400 si falta o no coincide; 503 si no hay
        secreto configurado). El API no confía en el contenido del evento: vuelve a consultar el cargo a Culqi.
        El esquema de firma está pendiente de verificar contra la documentación oficial de Culqi.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        '200': { description: Recibido }
        '400': { $ref: '#/components/responses/Error' }
        '409':
          description: Evento fuera de orden; ver `receiveStripeWebhook`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  # -------------------------------------------------------------------- Auth
  /auth/google:
    post:
      operationId: loginWithGoogle
      tags: [Auth]
      summary: Iniciar sesión con Google (solo dominio de la empresa)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [idToken]
              properties:
                idToken: { type: string }
      responses:
        '200':
          description: Sesión. El refresh token viaja solo en la cookie `desertica_refresh`.
          headers:
            Set-Cookie: { $ref: '#/components/headers/RefreshCookie' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /auth/refresh:
    post:
      operationId: refreshSession
      tags: [Auth]
      summary: Renovar el token de acceso
      description: |
        Lee la cookie `desertica_refresh`, la rota y devuelve un token de acceso nuevo con una cookie nueva.
        Reutilizar un refresh ya rotado revoca todas las sesiones del usuario.
      security:
        - refreshCookie: []
      responses:
        '200':
          description: Sesión renovada
          headers:
            Set-Cookie: { $ref: '#/components/headers/RefreshCookie' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '401': { $ref: '#/components/responses/Error' }
  /auth/logout:
    post:
      operationId: logout
      tags: [Auth]
      summary: Cerrar sesión
      description: Revoca el refresh token de la cookie `desertica_refresh` y la borra.
      security:
        - refreshCookie: []
      responses:
        '204':
          description: Cerrada
          headers:
            Set-Cookie: { $ref: '#/components/headers/RefreshCookie' }
  /auth/me:
    get:
      operationId: getMe
      tags: [Auth]
      summary: Usuario autenticado y sus permisos
      responses:
        '200':
          description: Usuario
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Error' }

  # ----------------------------------------------------------------- Catalog
  /tour-refs:
    get:
      operationId: listTourRefs
      tags: [Catalog]
      summary: Listar tours operativos
      x-permission: catalog:read
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Tours
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/TourRef' }
                  meta: { $ref: '#/components/schemas/Meta' }
  /tour-refs/sync:
    post:
      operationId: syncTourRefs
      tags: [Catalog]
      summary: Sincronizar tours desde el CMS
      x-permission: catalog:write
      responses:
        '200':
          description: Resultado
          content:
            application/json:
              schema:
                type: object
                required: [created, updated]
                properties:
                  created: { type: integer }
                  updated: { type: integer }
  /tour-refs/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      operationId: getTourRef
      tags: [Catalog]
      summary: Ver un tour operativo
      x-permission: catalog:read
      responses:
        '200':
          description: Tour
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TourRef' }
        '404': { $ref: '#/components/responses/Error' }
    patch:
      operationId: updateTourRef
      tags: [Catalog]
      summary: Editar ajustes operativos de un tour
      x-permission: catalog:write
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateTourRef' }
      responses:
        '404': { $ref: '#/components/responses/Error' }
        '200':
          description: Tour
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TourRef' }
  /departures:
    get:
      operationId: listDepartures
      tags: [Catalog]
      summary: Listar salidas
      x-permission: departures:read
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: tourRefId
          in: query
          schema: { type: string, format: uuid }
        - name: from
          in: query
          schema: { type: string, format: date-time }
        - name: to
          in: query
          schema: { type: string, format: date-time }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/DepartureStatus' }
      responses:
        '200':
          description: Salidas
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Departure' }
                  meta: { $ref: '#/components/schemas/Meta' }
    post:
      operationId: createDepartures
      tags: [Catalog]
      summary: Crear una salida (o una serie)
      x-permission: departures:write
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateDeparture' }
      responses:
        '201':
          description: Salidas creadas
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Departure' }
        '409': { $ref: '#/components/responses/Error' }
  /departures/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      operationId: getDeparture
      tags: [Catalog]
      summary: Ver una salida
      x-permission: departures:read
      responses:
        '200':
          description: Salida
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Departure' }
        '404': { $ref: '#/components/responses/Error' }
    patch:
      operationId: updateDeparture
      tags: [Catalog]
      summary: Editar una salida
      x-permission: departures:write
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateDeparture' }
      responses:
        '404': { $ref: '#/components/responses/Error' }
        '200':
          description: Salida
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Departure' }
        '409':
          description: La capacidad nueva es menor que los asientos vendidos
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /departures/{id}/manifest:
    get:
      operationId: getDepartureManifest
      tags: [Catalog]
      summary: Manifiesto de pasajeros de una salida
      x-permission: departures:read
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '404': { $ref: '#/components/responses/Error' }
        '200':
          description: Manifiesto
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Manifest' }
  /departures/{id}/cancel:
    post:
      operationId: cancelDeparture
      tags: [Catalog]
      summary: Cancelar una salida por decisión de la empresa
      description: |
        Aplica a todas las reservas confirmadas de la salida. Con `resolution = REFUND` reembolsa el 100 %
        y emite notas de crédito; con `RESCHEDULE` mueve las reservas a `targetDepartureId`. Notifica
        a los clientes.
      x-permission: departures:cancel
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason, resolution]
              properties:
                reason: { type: string }
                resolution: { type: string, enum: [REFUND, RESCHEDULE, CLIENT_CHOICE] }
                targetDepartureId: { type: string, format: uuid }
      responses:
        '202':
          description: Cancelación en proceso
          content:
            application/json:
              schema:
                type: object
                required: [affectedBookings]
                properties:
                  affectedBookings: { type: integer }
  /price-rules:
    get:
      operationId: listPriceRules
