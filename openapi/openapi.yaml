        '201':
          description: Usuario
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '409': { $ref: '#/components/responses/Error' }
  /users/{id}:
    patch:
      operationId: updateUser
      tags: [Admin]
      summary: Cambiar rol o desactivar a un usuario
      x-permission: users:write
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                roleId: { type: string, format: uuid }
                active: { type: boolean }
      responses:
        '404': { $ref: '#/components/responses/Error' }
        '200':
          description: Usuario
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
  /roles:
    get:
      operationId: listRoles
      tags: [Admin]
      summary: Listar roles y permisos
      x-permission: users:read
      responses:
        '200':
          description: Roles
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Role' }
  /companies/current:
    get:
      operationId: getCompany
      tags: [Admin]
      summary: Datos fiscales de la empresa emisora
      x-permission: company:read
      responses:
        '200':
          description: Empresa
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Company' }
    put:
      operationId: saveCompany
      tags: [Admin]
      summary: Guardar los datos fiscales de la empresa
      description: El certificado digital y las credenciales SOL no pasan por este API; viven en `desertica-billing`.
      x-permission: company:write
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CompanyInput' }
      responses:
        '200':
          description: Empresa
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Company' }
  /series:
    get:
      operationId: listSeries
      tags: [Admin]
      summary: Listar series de comprobantes
      x-permission: company:read
      responses:
        '200':
          description: Series
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Series' }
    post:
      operationId: createSeries
      tags: [Admin]
      summary: Crear una serie
      x-permission: company:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [docType, prefix]
              properties:
                docType: { $ref: '#/components/schemas/DocumentType' }
                prefix: { type: string, pattern: '^[BFE][A-Z0-9]{3}$' }
                nextNumber: { type: integer, minimum: 1, default: 1 }
      responses:
        '201':
          description: Serie
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Series' }
  /settings:
    get:
      operationId: getSettings
      tags: [Admin]
      summary: Leer los ajustes operativos
      x-permission: settings:read
