      operationId: createBlockedIdentity
      tags: [Admin]
      summary: Bloquear un correo o una IP
      x-permission: fraud:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, value]
              properties:
                kind: { type: string, enum: [EMAIL, IP] }
                value: { type: string }
                reason: { type: string }
      responses:
        '201':
          description: Bloqueo
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BlockedIdentity' }
  /audit-logs:
    get:
      operationId: listAuditLogs
      tags: [Admin]
      summary: Consultar la auditoría
      x-permission: audit:read
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: entity
          in: query
          schema: { type: string }
        - name: entityId
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Eventos
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/AuditLog' }
                  meta: { $ref: '#/components/schemas/Meta' }

  # ----------------------------------------------------------------- Reports
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [Reports]
      summary: Resumen del panel (ventas, ocupación y pendientes)
      x-permission: reports:read
      parameters:
        - name: from
          in: query
          required: true
          schema: { type: string, format: date }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date }
      responses:
        '200':
          description: Resumen
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DashboardSummary' }
  /reports/sales:
    get:
      operationId: getSalesReport
      tags: [Reports]
      summary: Reporte de ventas
      x-permission: reports:read
      parameters:
        - name: from
          in: query
          required: true
          schema: { type: string, format: date }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date }
        - name: groupBy
          in: query
          schema: { type: string, enum: [day, tour, provider], default: day }
        - name: format
          in: query
          schema: { type: string, enum: [json, csv], default: json }
      responses:
        '200':
          description: Reporte
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required: [key, currency, grossCents, refundedCents, bookings]
                      properties:
                        key: { type: string }
                        currency: { $ref: '#/components/schemas/Currency' }
                        grossCents: { type: integer }
                        refundedCents: { type: integer }
                        bookings: { type: integer }
            text/csv:
              schema: { type: string }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    bookingToken:
      type: apiKey
      in: header
      name: X-Booking-Token
    refreshCookie:
      type: apiKey
      in: cookie
      name: desertica_refresh
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    Reference:
      name: reference
      in: path
      required: true
      schema: { type: string, example: DST-7K4Q9M }
    TourSlug:
      name: slug
      in: path
      required: true
      schema: { type: string, example: dune-buggy }
    LinkToken:
      name: token
      in: path
      required: true
      schema: { type: string }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: pageSize
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      schema: { type: string, maxLength: 128 }
  headers:
    RefreshCookie:
      description: |
        `desertica_refresh=<token>; HttpOnly; Secure; SameSite=Strict; Path=/api/auth`. El navegador la
        envía solo a `/api/auth/*`; el SPA nunca lee el refresh token. Al cerrar sesión se emite vacía y
        con `Max-Age=0`.
      schema: { type: string }
  responses:
    Error:
      description: Error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    # ----------------------------------------------------------- Comunes
    Error:
      type: object
      required: [statusCode, error, message]
      properties:
        statusCode: { type: integer }
        error: { type: string }
        message:
          oneOf:
            - type: string
            - type: array
              items: { type: string }
        details:
          type: object
          additionalProperties: true
    Meta:
      type: object
      required: [page, pageSize, total]
      properties:
        page: { type: integer }
        pageSize: { type: integer }
        total: { type: integer }
    Currency:
      type: string
      enum: [USD, PEN]
    IdDocType:
      type: string
      enum: [DNI, CE, PASSPORT, RUC]
    TourFormat:
      type: string
      enum: [SHARED, PRIVATE]
    PriceUnit:
      type: string
      enum: [PER_PERSON, PER_GROUP]
    DepartureStatus:
      type: string
      enum: [OPEN, CLOSED, CANCELLED, COMPLETED]
    BookingStatus:
      type: string
      enum: [PENDING_PAYMENT, CONFIRMED, COMPLETED, CANCELLED, NO_SHOW]
    PaymentProvider:
      type: string
      enum: [STRIPE, CULQI, MANUAL]
    PaymentMethod:
      type: string
      enum: [CARD, WALLET, YAPE, CASH, TRANSFER, OTHER]
    PaymentKind:
      type: string
      enum: [FULL, DEPOSIT, BALANCE]
    PaymentStatus:
      type: string
      enum: [PENDING, REQUIRES_ACTION, SUCCEEDED, FAILED, CANCELLED, PARTIALLY_REFUNDED, REFUNDED, DISPUTED]
    DisputeStatus:
      type: string
      enum: [OPEN, WON, LOST, CLOSED]
    DocumentType:
      type: string
      enum: [BOLETA, FACTURA, NOTA_CREDITO, NOTA_DEBITO]
    DocumentStatus:
      type: string
      enum: [PENDING, ISSUED, ACCEPTED, REJECTED, VOIDED, ERROR]
    WaiverStatus:
      type: string
      enum: [PENDING, SIGNED]
    ComplaintStatus:
      type: string
      enum: [OPEN, IN_PROGRESS, ANSWERED]
    LegalDocumentKind:
      type: string
      enum: [TERMS, PRIVACY, CANCELLATION, COOKIES, CONDUCT]

    # ---------------------------------------------------------- Catálogo
    TourRef:
      type: object
      required: [id, slug, title, active, requiresWaiver]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        title: { type: string }
        durationHours: { type: [integer, 'null'] }
        active: { type: boolean }
        requiresWaiver: { type: boolean }
        minAge: { type: [integer, 'null'] }
        minHeightCm: { type: [integer, 'null'] }
        defaultCapacity: { type: [integer, 'null'] }
        cancellationPolicyId: { type: [string, 'null'], format: uuid }
        cmsSyncedAt: { type: [string, 'null'], format: date-time }
    UpdateTourRef:
      type: object
      properties:
        active: { type: boolean }
        requiresWaiver: { type: boolean }
        minAge: { type: [integer, 'null'] }
        minHeightCm: { type: [integer, 'null'] }
        defaultCapacity: { type: [integer, 'null'] }
        cancellationPolicyId: { type: [string, 'null'], format: uuid }
    Departure:
      type: object
      required: [id, tourRefId, tourSlug, tourTitle, startsAt, capacity, seatsSold, format, language, status]
      properties:
        id: { type: string, format: uuid }
        tourRefId: { type: string, format: uuid }
        tourSlug: { type: string }
        tourTitle: { type: string, description: Título del tour en el idioma de la petición (`Accept-Language`) con respaldo al inglés. }
        startsAt: { type: string, format: date-time }
        capacity: { type: integer }
        seatsSold: { type: integer }
        seatsHeld: { type: integer }
        format: { $ref: '#/components/schemas/TourFormat' }
        language: { type: string }
        status: { $ref: '#/components/schemas/DepartureStatus' }
        meetingPoint: { type: [string, 'null'] }
        guideName: { type: [string, 'null'] }
        vehicleNote: { type: [string, 'null'] }
        notes: { type: [string, 'null'] }
        cutoffMinutes: { type: integer }
    CreateDeparture:
      type: object
      required: [tourRefId, startsAt, capacity]
      properties:
        tourRefId: { type: string, format: uuid }
        startsAt: { type: string, format: date-time }
        capacity: { type: integer, minimum: 1 }
        format: { $ref: '#/components/schemas/TourFormat' }
        language: { type: string }
        meetingPoint: { type: string }
        guideName: { type: string }
        vehicleNote: { type: string }
        notes: { type: string }
        cutoffMinutes: { type: integer, minimum: 0 }
        repeat:
          type: object
          description: Crea una serie de salidas hasta `until` en los días indicados (0 = domingo).
          required: [until, weekdays]
          properties:
            until: { type: string, format: date }
            weekdays:
              type: array
              items: { type: integer, minimum: 0, maximum: 6 }
    UpdateDeparture:
      type: object
      properties:
        startsAt: { type: string, format: date-time }
        capacity: { type: integer, minimum: 1 }
        status: { type: string, enum: [OPEN, CLOSED] }
        meetingPoint: { type: string }
        guideName: { type: string }
        vehicleNote: { type: string }
        notes: { type: string }
        cutoffMinutes: { type: integer, minimum: 0 }
    PriceRule:
      allOf:
        - $ref: '#/components/schemas/PriceRuleInput'
        - type: object
          required: [id]
          properties:
            id: { type: string, format: uuid }
    PriceRuleInput:
      type: object
      required: [tourRefId, currency, adultCents]
      properties:
        tourRefId: { type: string, format: uuid }
        currency: { $ref: '#/components/schemas/Currency' }
        format: { $ref: '#/components/schemas/TourFormat' }
        unit: { $ref: '#/components/schemas/PriceUnit' }
        adultCents: { type: integer, minimum: 0, description: Con IGV incluido. }
        childCents: { type: [integer, 'null'], minimum: 0 }
        groupCents: { type: [integer, 'null'], minimum: 0 }
        minPeople: { type: [integer, 'null'] }
        maxPeople: { type: [integer, 'null'] }
        validFrom: { type: [string, 'null'], format: date }
        validTo: { type: [string, 'null'], format: date }
        priority: { type: integer, default: 0 }
        active: { type: boolean, default: true }
    Blackout:
      allOf:
        - $ref: '#/components/schemas/BlackoutInput'
        - type: object
          required: [id]
          properties:
            id: { type: string, format: uuid }
    BlackoutInput:
      type: object
      required: [startsOn, endsOn]
      properties:
        tourRefId: { type: [string, 'null'], format: uuid, description: Nulo = todos los tours. }
        startsOn: { type: string, format: date }
        endsOn: { type: string, format: date }
        reason: { type: string }
    CancellationPolicyInput:
      type: object
      required: [key, name, tiers]
      properties:
        key: { type: string }
        name: { type: string }
        tiers:
          type: array
          description: Ordenados de mayor a menor `hoursBefore`.
          items:
            type: object
            required: [hoursBefore, refundPercent]
            properties:
              hoursBefore: { type: integer, minimum: 0 }
              refundPercent: { type: integer, minimum: 0, maximum: 100 }
        depositRefundable: { type: boolean }
    CancellationPolicy:
      allOf:
        - $ref: '#/components/schemas/CancellationPolicyInput'
        - type: object
          required: [id, version, active]
          properties:
            id: { type: string, format: uuid }
            version: { type: integer }
            active: { type: boolean }

    # -------------------------------------------------- Público / reserva
    AvailableDeparture:
      type: object
      required: [departureId, startsAt, language, format, seatsLeft, price]
      properties:
        departureId: { type: string, format: uuid }
        startsAt: { type: string, format: date-time }
        language: { type: string }
        format: { $ref: '#/components/schemas/TourFormat' }
        seatsLeft: { type: integer, description: Cupos libres; 0 significa agotada. }
        meetingPoint: { type: [string, 'null'] }
        price:
          type: object
          required: [currency, unit, adultCents]
          properties:
            currency: { $ref: '#/components/schemas/Currency' }
            unit: { $ref: '#/components/schemas/PriceUnit' }
            adultCents: { type: integer }
            childCents: { type: [integer, 'null'] }
            groupCents: { type: [integer, 'null'] }
    QuoteRequest:
      type: object
      required: [departureId, adults, currency]
      properties:
        departureId: { type: string, format: uuid }
        adults: { type: integer, minimum: 1 }
        children: { type: integer, minimum: 0, default: 0 }
        currency: { $ref: '#/components/schemas/Currency' }
    Quote:
      type: object
      required: [currency, totalCents, depositCents, lines]
      properties:
        currency: { $ref: '#/components/schemas/Currency' }
        totalCents: { type: integer, description: Con IGV incluido. }
        depositCents: { type: integer, description: Monto del depósito según la configuración. }
        lines:
          type: array
          items:
            type: object
            required: [label, quantity, unitCents, totalCents]
            properties:
              label: { type: string }
              quantity: { type: integer }
              unitCents: { type: integer }
              totalCents: { type: integer }
        cancellationTiers:
          type: array
          items:
            type: object
            properties:
              hoursBefore: { type: integer }
              refundPercent: { type: integer }
    Hold:
      type: object
      required: [token, departureId, seats, expiresAt]
      properties:
        token: { type: string }
        departureId: { type: string, format: uuid }
        seats: { type: integer }
        expiresAt: { type: string, format: date-time }
    Billing:
      type: object
      required: [docType, name, idDocType, idDocNumber]
      description: Datos del receptor del comprobante.
      properties:
        docType: { type: string, enum: [BOLETA, FACTURA] }
        name: { type: string, description: Nombre o razón social. }
        idDocType: { $ref: '#/components/schemas/IdDocType' }
        idDocNumber: { type: string }
        address: { type: string }
        email: { type: string, format: email }
    CustomerInput:
      type: object
      required: [email, firstName, lastName]
      properties:
        email: { type: string, format: email }
        firstName: { type: string }
        lastName: { type: string }
        phone: { type: string }
        country: { type: string, minLength: 2, maxLength: 2 }
        idDocType: { $ref: '#/components/schemas/IdDocType' }
        idDocNumber: { type: string }
        locale: { type: string }
    PassengerInput:
      type: object
      required: [firstName, lastName]
      properties:
        firstName: { type: string }
        lastName: { type: string }
        idDocType: { $ref: '#/components/schemas/IdDocType' }
        idDocNumber: { type: string }
        birthDate: { type: string, format: date }
        nationality: { type: string }
        emergencyContactName: { type: string }
        emergencyContactPhone: { type: string }
    Attribution:
      type: object
      properties:
        utmSource: { type: string }
        utmMedium: { type: string }
        utmCampaign: { type: string }
        utmContent: { type: string }
        utmTerm: { type: string }
        gclid: { type: string }
        fbclid: { type: string }
        landingPath: { type: string }
        referrer: { type: string }
    CreatePublicBooking:
      type: object
      required: [holdToken, currency, adults, customer, billing, paymentKind, acceptedLegalDocumentIds]
      properties:
        holdToken: { type: string }
        currency: { $ref: '#/components/schemas/Currency' }
        adults: { type: integer, minimum: 1, maximum: 20 }
        children: { type: integer, minimum: 0, maximum: 20, default: 0 }
        customer: { $ref: '#/components/schemas/CustomerInput' }
        passengers:
          type: array
          items: { $ref: '#/components/schemas/PassengerInput' }
        billing: { $ref: '#/components/schemas/Billing' }
        paymentKind: { type: string, enum: [FULL, DEPOSIT] }
        acceptedLegalDocumentIds:
          type: array
          description: Versiones de términos, privacidad y política de cancelación aceptadas.
          items: { type: string, format: uuid }
        notes: { type: string, maxLength: 1000 }
        locale: { type: string }
        attribution: { $ref: '#/components/schemas/Attribution' }
        anonymousId:
          type: string
          description: Identificador anónimo del visitante (el mismo del consentimiento de cookies). Permite saber si hubo consentimiento de marketing al enviar eventos desde el servidor.
        turnstileToken: { type: string }
    CreateManualBooking:
      type: object
      required: [departureId, currency, adults, customer, billing]
      properties:
        departureId: { type: string, format: uuid }
        currency: { $ref: '#/components/schemas/Currency' }
        adults: { type: integer, minimum: 1 }
        children: { type: integer, minimum: 0, default: 0 }
        customer: { $ref: '#/components/schemas/CustomerInput' }
        passengers:
          type: array
          items: { $ref: '#/components/schemas/PassengerInput' }
        billing: { $ref: '#/components/schemas/Billing' }
        depositCents: { type: integer, minimum: 0 }
        overrideTotalCents:
          type: integer
          minimum: 0
          description: Precio acordado distinto del de lista; requiere `bookings:override`.
        notes: { type: string }
        sendConfirmation: { type: boolean, default: true }
    UpdateBooking:
      type: object
      properties:
        notes: { type: string }
        customer: { $ref: '#/components/schemas/CustomerInput' }
        billing: { $ref: '#/components/schemas/Billing' }
        passengers:
          type: array
          items: { $ref: '#/components/schemas/PassengerInput' }
    Passenger:
      allOf:
        - $ref: '#/components/schemas/PassengerInput'
        - type: object
          required: [id]
          properties:
            id: { type: string, format: uuid }
    BookingSummary:
      type: object
      required: [id, reference, status, departureId, startsAt, tourSlug, tourTitle, customerName, currency, totalCents, paidCents]
      properties:
        id: { type: string, format: uuid }
        reference: { type: string }
        status: { $ref: '#/components/schemas/BookingStatus' }
        source: { type: string, enum: [WEB, MANUAL] }
        departureId: { type: string, format: uuid }
        startsAt: { type: string, format: date-time }
        tourSlug: { type: string }
        tourTitle: { type: string }
        customerName: { type: string }
        adults: { type: integer }
        children: { type: integer }
        currency: { $ref: '#/components/schemas/Currency' }
        totalCents: { type: integer }
        paidCents: { type: integer }
        createdAt: { type: string, format: date-time }
    Booking:
      allOf:
        - $ref: '#/components/schemas/BookingSummary'
        - type: object
          properties:
            customer: { $ref: '#/components/schemas/Customer' }
            depositCents: { type: [integer, 'null'] }
            refundedCents: { type: integer, description: Devuelto efectivamente por la pasarela o a mano. }
            refundDueCents:
              type: integer
              description: Reembolsos calculados (cancelación, cambio de precio) que aún no se ejecutaron.
            billing: { $ref: '#/components/schemas/Billing' }
            notes: { type: [string, 'null'] }
            locale: { type: string }
            priceSnapshot: { type: object, additionalProperties: true }
            cancellationSnapshot: { type: object, additionalProperties: true }
            attribution: { $ref: '#/components/schemas/Attribution' }
            cancelledAt: { type: [string, 'null'], format: date-time }
            cancelReason: { type: [string, 'null'] }
            passengers:
              type: array
              items: { $ref: '#/components/schemas/Passenger' }
            payments:
              type: array
              items: { $ref: '#/components/schemas/Payment' }
            documents:
              type: array
              items: { $ref: '#/components/schemas/Document' }
            waivers:
              type: array
              items: { $ref: '#/components/schemas/Waiver' }
    PublicBooking:
      type: object
      description: Vista de la reserva para el cliente (sin datos internos).
      required: [reference, status, tourSlug, startsAt, format, currency, totalCents, paidCents, pendingCents, paymentOptions]
      properties:
        reference: { type: string }
        status: { $ref: '#/components/schemas/BookingStatus' }
        tourSlug: { type: string }
        startsAt: { type: string, format: date-time }
        meetingPoint: { type: [string, 'null'] }
        adults: { type: integer }
        children: { type: integer }
        currency: { $ref: '#/components/schemas/Currency' }
        totalCents: { type: integer }
        paidCents: { type: integer }
        pendingCents: { type: integer }
        depositCents: { type: [integer, 'null'] }
        format: { $ref: '#/components/schemas/TourFormat' }
        passengers:
          type: array
          items:
            type: object
            required: [firstName, lastName]
            properties:
              firstName: { type: string }
              lastName: { type: string }
        paymentOptions:
          $ref: '#/components/schemas/PaymentOptions'
        cancellationTiers:
          type: array
          items:
            type: object
            properties:
              hoursBefore: { type: integer }
              refundPercent: { type: integer }
        waivers:
          type: array
          items:
            type: object
            properties:
              token: { type: string }
              passengerName: { type: [string, 'null'] }
              status: { $ref: '#/components/schemas/WaiverStatus' }
        documents:
          type: array
          items:
            type: object
            properties:
              docType: { $ref: '#/components/schemas/DocumentType' }
              number: { type: string, example: B001-00000012 }
              pdfUrl: { type: string, format: uri }
    PaymentOptions:
      type: array
      description: Pasarelas y tipos de pago disponibles para la moneda y el saldo de la reserva (vacío si no queda saldo).
      items:
        type: object
        required: [provider, kinds]
        properties:
          provider: { type: string, enum: [STRIPE, CULQI] }
          kinds:
            type: array
            items: { $ref: '#/components/schemas/PaymentKind' }
    PublicBookingCreated:
      type: object
      required: [booking, accessToken]
      properties:
        booking: { $ref: '#/components/schemas/PublicBooking' }
        accessToken:
          type: string
          description: Se envía como `X-Booking-Token` en las llamadas siguientes y por email.
        paymentOptions:
          $ref: '#/components/schemas/PaymentOptions'

    # ------------------------------------------------------------- Pagos
    CreatePaymentRequest:
      type: object
      required: [kind]
      properties:
        kind: { $ref: '#/components/schemas/PaymentKind' }
    CulqiChargeRequest:
      type: object
      required: [kind, token, email]
      properties:
        kind: { $ref: '#/components/schemas/PaymentKind' }
        token: { type: string, description: Token generado por Culqi.js en el navegador. Nunca un número de tarjeta. }
        email: { type: string, format: email }
        paymentId:
          type: string
          format: uuid
          description: Pago `REQUIRES_ACTION` que se continúa tras la autenticación 3DS (con `authentication3DS`).
        authentication3DS:
          type: object
          additionalProperties: true
          description: Parámetros que devolvió la autenticación 3DS en el navegador (Culqi3DS).
    StripeIntent:
      type: object
      required: [paymentId, clientSecret, publishableKey, amountCents, currency]
      properties:
        paymentId: { type: string, format: uuid }
        clientSecret: { type: string }
        publishableKey: { type: string }
        amountCents: { type: integer }
        currency: { type: string, enum: [USD] }
    CulqiChargeResult:
      type: object
      required: [paymentId, status]
      properties:
        paymentId: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/PaymentStatus' }
        action:
          type: object
          description: |
            Presente cuando el banco exige autenticación 3DS. El navegador la ejecuta con Culqi3DS y reenvía el
            mismo `token` con `paymentId` y `authentication3DS`. `parameters` trae `amountCents`, `currency` y `email`.
          properties:
            type: { type: string, enum: [THREE_DS] }
            parameters: { type: object, additionalProperties: true }
        failureMessage: { type: [string, 'null'] }
    PaymentLink:
      type: object
      required: [id, token, url, kind, currency, amountCents, expiresAt]
      properties:
        id: { type: string, format: uuid }
        token: { type: string }
        url: { type: string, format: uri }
        kind: { $ref: '#/components/schemas/PaymentKind' }
        currency: { $ref: '#/components/schemas/Currency' }
        amountCents: { type: integer }
        expiresAt: { type: string, format: date-time }
        usedAt: { type: [string, 'null'], format: date-time }
    PaymentLinkInfo:
      type: object
      required: [reference, kind, currency, amountCents, expiresAt, paymentOptions]
      properties:
        reference: { type: string }
        tourSlug: { type: string }
        startsAt: { type: string, format: date-time }
        kind: { $ref: '#/components/schemas/PaymentKind' }
        currency: { $ref: '#/components/schemas/Currency' }
        amountCents: { type: integer }
        expiresAt: { type: string, format: date-time }
        paymentOptions:
          type: array
          items: { type: string, enum: [STRIPE, CULQI] }
    Payment:
      type: object
      required: [id, bookingId, bookingReference, provider, method, kind, status, currency, amountCents]
      properties:
        id: { type: string, format: uuid }
        bookingId: { type: string, format: uuid }
        bookingReference: { type: string }
        provider: { $ref: '#/components/schemas/PaymentProvider' }
        method: { $ref: '#/components/schemas/PaymentMethod' }
        kind: { $ref: '#/components/schemas/PaymentKind' }
        status: { $ref: '#/components/schemas/PaymentStatus' }
        currency: { $ref: '#/components/schemas/Currency' }
        amountCents: { type: integer }
        refundedCents: { type: integer }
        providerRef: { type: [string, 'null'] }
        failureCode: { type: [string, 'null'] }
        paidAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
    Refund:
      type: object
      required: [id, paymentId, bookingId, bookingReference, currency, amountCents, reason, status]
      properties:
        id: { type: string, format: uuid }
        paymentId: { type: string, format: uuid }
        bookingId: { type: string, format: uuid }
        bookingReference: { type: string }
        currency: { $ref: '#/components/schemas/Currency' }
        amountCents: { type: integer }
        reason: { type: string }
        status: { type: string, enum: [PENDING, SUCCEEDED, FAILED] }
        creditNoteId: { type: [string, 'null'], format: uuid }
        requestedBy: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
    Dispute:
      type: object
      required: [id, paymentId, bookingId, bookingReference, provider, status, amountCents, currency]
      properties:
        id: { type: string, format: uuid }
        paymentId: { type: string, format: uuid }
        bookingId: { type: string, format: uuid }
        bookingReference: { type: string }
        provider: { $ref: '#/components/schemas/PaymentProvider' }
        providerRef: { type: string }
        status: { $ref: '#/components/schemas/DisputeStatus' }
        reason: { type: [string, 'null'] }
        amountCents: { type: integer }
        currency: { $ref: '#/components/schemas/Currency' }
        evidenceDueAt: { type: [string, 'null'], format: date-time }
        notes: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }

    # ------------------------------------------------------ Comprobantes
    Document:
      type: object
      required: [id, bookingId, bookingReference, customerName, docType, status, series, number, currency, totalCents, taxableCents, igvCents]
      properties:
        id: { type: string, format: uuid }
        bookingId: { type: string, format: uuid }
        bookingReference: { type: string }
        customerName: { type: string, description: Nombre o razón social del receptor del comprobante. }
        paymentId: { type: [string, 'null'], format: uuid }
        docType: { $ref: '#/components/schemas/DocumentType' }
        status: { $ref: '#/components/schemas/DocumentStatus' }
        series: { type: string, example: B001 }
        number: { type: integer }
        currency: { $ref: '#/components/schemas/Currency' }
        totalCents: { type: integer }
        taxableCents: { type: integer, description: Base imponible. }
        igvCents: { type: integer }
        exchangeRate: { type: [string, 'null'], description: Tipo de cambio SUNAT si es en USD. }
        sunatCode: { type: [string, 'null'] }
        sunatMessage: { type: [string, 'null'] }
        relatedDocumentId: { type: [string, 'null'], format: uuid }
        hasXml: { type: boolean }
        hasCdr: { type: boolean }
        hasPdf: { type: boolean }
        issuedAt: { type: [string, 'null'], format: date-time }
        voidedAt: { type: [string, 'null'], format: date-time }

    # ---------------------------------------------------- Clientes y legal
    Customer:
      allOf:
        - $ref: '#/components/schemas/CustomerInput'
        - type: object
          required: [id]
          properties:
            id: { type: string, format: uuid }
            bookings:
              type: array
              items: { $ref: '#/components/schemas/BookingSummary' }
    Waiver:
      type: object
      required: [id, bookingId, status, version]
      properties:
        id: { type: string, format: uuid }
        bookingId: { type: string, format: uuid }
        passengerId: { type: [string, 'null'], format: uuid }
        version: { type: integer }
        status: { $ref: '#/components/schemas/WaiverStatus' }
        signerName: { type: [string, 'null'] }
        signedAt: { type: [string, 'null'], format: date-time }
        hasPdf: { type: boolean }
    WaiverForm:
      type: object
      required: [status, version, tourSlug, startsAt]
      properties:
        status: { $ref: '#/components/schemas/WaiverStatus' }
        version: { type: integer }
        tourSlug: { type: string }
        startsAt: { type: string, format: date-time }
        passengerName: { type: [string, 'null'] }
        minAge: { type: [integer, 'null'] }
        minHeightCm: { type: [integer, 'null'] }
    LegalDocument:
      type: object
      description: |
        Versión publicada de un documento legal. Al publicar se guarda un snapshot inmutable del texto
        traído del CMS (título, Markdown y su hash); es la evidencia de lo que aceptó el cliente. El texto
        no se devuelve aquí: la web lo muestra desde el CMS y `contentHash` permite comprobar que coincide.
      required: [id, kind, locale, version, cmsSlug, publishedAt, title, contentHash]
      properties:
        title: { type: string, description: Título de la página en el CMS al publicar. }
        contentHash: { type: string, description: SHA-256 (hex) de título y texto del snapshot. }
        id: { type: string, format: uuid }
        kind: { $ref: '#/components/schemas/LegalDocumentKind' }
        locale: { type: string }
        version: { type: integer }
        cmsSlug: { type: string }
        publishedAt: { type: string, format: date-time }
    CreateComplaint:
      type: object
      required: [kind, goodType, consumerName, idDocType, idDocNumber, address, email, description, detail, request]
      properties:
        kind: { type: string, enum: [RECLAMO, QUEJA] }
        goodType: { type: string, enum: [PRODUCT, SERVICE] }
        consumerName: { type: string }
        idDocType: { $ref: '#/components/schemas/IdDocType' }
        idDocNumber: { type: string }
        address: { type: string }
        email: { type: string, format: email }
        phone: { type: string }
        isMinor: { type: boolean }
        bookingRef: { type: string }
        amountCents: { type: integer }
        currency: { $ref: '#/components/schemas/Currency' }
        description: { type: string, description: Identificación del bien contratado. }
        detail: { type: string }
        request: { type: string, description: Pedido del consumidor. }
        turnstileToken: { type: string }
    Complaint:
      allOf:
        - $ref: '#/components/schemas/CreateComplaint'
        - type: object
          required: [id, status, dueAt, createdAt]
          properties:
            id: { type: integer }
            status: { $ref: '#/components/schemas/ComplaintStatus' }
            answer: { type: [string, 'null'] }
            answeredAt: { type: [string, 'null'], format: date-time }
            dueAt: { type: string, format: date-time }
            createdAt: { type: string, format: date-time }

    # ------------------------------------------------------------- Admin
    Session:
      type: object
      required: [accessToken, expiresIn, user]
      properties:
        accessToken: { type: string }
        expiresIn: { type: integer, description: Segundos de vigencia del token de acceso. }
        user: { $ref: '#/components/schemas/User' }
    Role:
      type: object
      required: [id, key, name, permissions]
      properties:
        id: { type: string, format: uuid }
        key: { type: string }
        name: { type: string }
        permissions:
          type: array
          items: { type: string }
    User:
      type: object
      required: [id, email, name, active, role]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        name: { type: string }
        active: { type: boolean }
        role: { $ref: '#/components/schemas/Role' }
        lastLoginAt: { type: [string, 'null'], format: date-time }
    CompanyInput:
      type: object
      required: [ruc, legalName, fiscalAddress]
      properties:
        ruc: { type: string, pattern: '^\d{11}$' }
        legalName: { type: string }
        tradeName: { type: string }
        fiscalAddress: { type: string }
        ubigeo: { type: string, pattern: '^\d{6}$' }
        igvRate: { type: string, example: '0.1800' }
        environment: { type: string, enum: [BETA, PRODUCTION] }
    Company:
      allOf:
        - $ref: '#/components/schemas/CompanyInput'
        - type: object
          required: [id]
          properties:
            id: { type: string, format: uuid }
    Series:
      type: object
      required: [id, docType, prefix, nextNumber, active]
      properties:
        id: { type: string, format: uuid }
        docType: { $ref: '#/components/schemas/DocumentType' }
        prefix: { type: string }
        nextNumber: { type: integer }
        active: { type: boolean }
    BlockedIdentity:
      type: object
      required: [id, kind, value]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [EMAIL, IP] }
        value: { type: string }
        reason: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
    AuditLog:
      type: object
      required: [id, action, entity, entityId, createdAt]
      properties:
        id: { type: string, format: uuid }
        actor: { type: [string, 'null'] }
        action: { type: string }
        entity: { type: string }
        entityId: { type: string }
        before: { type: [object, 'null'], additionalProperties: true }
        after: { type: [object, 'null'], additionalProperties: true }
        createdAt: { type: string, format: date-time }

    StaffQuoteRequest:
      allOf:
        - $ref: '#/components/schemas/QuoteRequest'
        - type: object
          properties:
            overrideTotalCents: { type: integer, minimum: 0 }
    CancellationQuote:
      type: object
      required: [currency, paidCents, refundCents, refundPercent]
      properties:
        currency: { $ref: '#/components/schemas/Currency' }
        paidCents: { type: integer, description: Total cobrado hasta ahora. }
        refundCents: { type: integer }
        refundPercent: { type: integer, minimum: 0, maximum: 100 }
        tier:
          type: [object, 'null']
          description: Tramo de la política aplicado.
          properties:
            hoursBefore: { type: integer }
            refundPercent: { type: integer }
        policyVersion: { type: [integer, 'null'] }
        reason: { type: [string, 'null'], description: 'Por qué no corresponde reembolso, si es el caso.' }
    Settings:
      type: object
      description: Ajustes operativos con su valor por defecto. Se permiten claves adicionales.
      properties:
        depositPercent: { type: integer, minimum: 0, maximum: 100, default: 30, description: Porcentaje del total que se cobra como depósito. }
        holdMinutes: { type: integer, minimum: 1, maximum: 120, default: 15, description: Duración del bloqueo de cupo. }
        operatorRefundLimitCents: { type: integer, minimum: 0, default: 20000, description: Tope de reembolso de un operador sin `payments:refund-any`. }
        complaintDueDays: { type: integer, minimum: 1, maximum: 60, default: 15, description: Días hábiles para responder un reclamo (a confirmar con el abogado). }
        autoIssueDocuments: { type: boolean, default: true, description: Emitir el comprobante automáticamente al confirmarse un pago (y la nota de crédito al reembolsar). }
        exchangeRateUsdPen: { type: string, example: '3.7500', description: Tipo de cambio SUNAT USD→PEN vigente para comprobantes en USD (si falta se usa EXCHANGE_RATE_FALLBACK). }
        exchangeRates: { type: object, additionalProperties: { type: string }, description: 'Tipos de cambio por fecha, p. ej. {"2026-10-04":"3.7500"}; tiene prioridad sobre `exchangeRateUsdPen`.' }
      additionalProperties: true
    SettingsInput:
      type: object
      properties:
        depositPercent: { type: integer, minimum: 0, maximum: 100 }
        holdMinutes: { type: integer, minimum: 1, maximum: 120 }
        operatorRefundLimitCents: { type: integer, minimum: 0 }
        complaintDueDays: { type: integer, minimum: 1, maximum: 60 }
      additionalProperties: true
    # ----------------------------------------------------------- Reportes
    Manifest:
      type: object
      required: [departure, passengers]
      properties:
        departure: { $ref: '#/components/schemas/Departure' }
        passengers:
          type: array
          items:
            type: object
            required: [bookingReference, name, waiverStatus]
            properties:
              bookingReference: { type: string }
              name: { type: string }
              idDocType: { $ref: '#/components/schemas/IdDocType' }
              idDocNumber: { type: [string, 'null'] }
              phone: { type: [string, 'null'] }
              emergencyContactName: { type: [string, 'null'] }
              emergencyContactPhone: { type: [string, 'null'] }
              medicalNotes: { type: [string, 'null'] }
              waiverStatus: { $ref: '#/components/schemas/WaiverStatus' }
              balanceDueCents: { type: integer, description: Saldo por cobrar el día de la salida. }
              currency: { $ref: '#/components/schemas/Currency' }
    DashboardSummary:
      type: object
      required: [sales, occupancy, pending]
      properties:
        sales:
          type: array
          items:
            type: object
            required: [currency, grossCents, refundedCents, bookings]
            properties:
              currency: { $ref: '#/components/schemas/Currency' }
              grossCents: { type: integer }
              refundedCents: { type: integer }
              bookings: { type: integer }
        occupancy:
          type: object
          properties:
            seatsSold: { type: integer }
            seatsCapacity: { type: integer }
        pending:
          type: object
          properties:
            unpaidBookings: { type: integer }
            documentsInError: { type: integer }
            waiversPending: { type: integer }
            openDisputes: { type: integer }
            complaintsDueSoon: { type: integer }
