      tags: [Admin]
      summary: Guardar ajustes operativos
      description: Solo cambia las claves enviadas. Las claves conocidas se validan por rango.
      x-permission: settings:write
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SettingsInput' }
      responses:
        '200':
          description: Ajustes
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Settings' }
