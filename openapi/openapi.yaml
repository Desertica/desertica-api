        - name: docType
          in: query
          schema: { $ref: '#/components/schemas/DocumentType' }
        - name: from
          in: query
          schema: { type: string, format: date-time }
        - name: to
          in: query
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: Comprobantes
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Document' }
                  meta: { $ref: '#/components/schemas/Meta' }
  /documents/{id}:
    get:
      operationId: getDocument
      tags: [Documents]
      summary: Ver un comprobante
      x-permission: documents:read
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Comprobante
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Document' }
        '404': { $ref: '#/components/responses/Error' }
  /documents/{id}/retry:
    post:
      operationId: retryDocument
      tags: [Documents]
      summary: Reintentar el envío de un comprobante en error o rechazado
      x-permission: documents:issue
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '202':
          description: Reencolado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Document' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /documents/{id}/void:
    post:
      operationId: voidDocument
      tags: [Documents]
      summary: Anular un comprobante (comunicación de baja)
      x-permission: documents:void
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, maxLength: 100 }
      responses:
        '202':
          description: Anulación encolada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Document' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /documents/{id}/credit-note:
    post:
      operationId: createCreditNote
      tags: [Documents]
      summary: Emitir una nota de crédito sobre un comprobante
      x-permission: documents:void
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason, amountCents]
              properties:
                reason: { type: string }
                amountCents: { type: integer, minimum: 1 }
      responses:
        '202':
          description: Nota de crédito encolada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Document' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /documents/{id}/files/{kind}:
    get:
      operationId: downloadDocumentFile
      tags: [Documents]
      summary: Descargar el XML, el CDR o el PDF
      x-permission: documents:read
      parameters:
        - $ref: '#/components/parameters/Id'
        - name: kind
          in: path
          required: true
          schema: { type: string, enum: [xml, cdr, pdf] }
      responses:
        '200':
          description: Archivo
          content:
            application/xml:
              schema: { type: string }
            application/pdf:
              schema: { type: string, format: binary }
            application/zip:
              schema: { type: string, format: binary }
